version: '3.8'
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/chatbot_ticketing
      - DB_NAME=chatbot_ticketing

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

  rasa:
    build: ./rasa-chatbot
    ports:
      - "5005:5005"
    volumes:
      - ./rasa-chatbot:/app
    command: rasa run --enable-api --cors "*"

volumes:
  mongo-data:
